<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クリエイターダッシュボード | DeNA Creator Links</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --accent:#f06a9b; --accent2:#c99bff; --prev:#d9c6cf;
  --hero:linear-gradient(135deg,#ffd6e5 0%,#ffe9f1 45%,#efe0ff 100%);
  --ink:#4a3540; --muted:#a3848f; --line:#f6dde6; --cardbg:#ffffff; --bg:#fff6f9;
  --up:#3fae86; --down:#e5577a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Zen Maru Gothic','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.brandbar{display:flex;justify-content:center;margin:8px 0 20px}
.brandbar img{height:34px;width:auto}
header.hero{position:relative;overflow:hidden;color:var(--ink);box-shadow:0 10px 30px rgba(240,106,155,.18);border-radius:22px;padding:24px 22px;background:var(--hero)}
header.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.85),transparent 70%)}
.pf{font-family:'Jost',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
header h1{position:relative;margin:8px 0 6px;font-size:26px;line-height:1.3;word-break:break-all}
header .meta{position:relative;font-size:13px;opacity:.9}
.big{position:relative;margin-top:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big .v{font-family:'Jost',sans-serif;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big .u{font-size:13px;opacity:.85}
.chip{display:inline-block;font-family:'Jost',sans-serif;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:rgba(255,255,255,.75)}
.chip.up{color:var(--up)} .chip.down{color:var(--down)}
h2{font-size:15px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"♡";color:var(--accent);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 14px rgba(240,106,155,.08);padding:14px}
.card .k{font-size:11.5px;color:var(--muted);line-height:1.3;min-height:30px}
.card .v{font-family:'Jost',sans-serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.card .v small{font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.card .d{font-size:11.5px;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .d b.up{color:var(--up)} .card .d b.down{color:var(--down)}
.panel{background:var(--cardbg);border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 14px rgba(240,106,155,.08);padding:16px}
.panel .note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.cmp{display:grid;gap:18px}
.cmprow .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.cmprow .lab span:last-child{font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:#fbeef3;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:6px}
.bar.cur i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar.prev i{background:var(--prev)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.chartbox{position:relative;height:260px}
.empty{text-align:center;color:var(--muted);padding:60px 0;line-height:1.9}
.list a{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list a:hover{background:#fff0f5}
.notice{margin:14px 0 0;padding:12px 14px;border-radius:16px;background:#fff;border:1px dashed #f3bcd0;font-size:12px;line-height:1.75;color:var(--ink)}
.notice b{color:var(--accent)}
footer{margin-top:32px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><img src="assets/dcl_logo.png" alt="DeNA Creator Links"></div>
  <main id="app"><div class="empty">読み込み中…</div></main>
  <footer>データ：TikTok LIVE Backstage（約2日遅れで反映）<br>© DeNA Creator Links</footer>
</div>
<script>
const $ = s => document.querySelector(s);
const fmt = (v, d=0) => v==null ? "—" : Number(v).toLocaleString("ja-JP",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = (c,p) => (c==null||!p) ? null : (c/p-1)*100;
const chg = v => v==null ? '<b>—</b>' : `<b class="${v>=0?'up':'down'}">${v>=0?'▲':'▼'} ${fmt(Math.abs(v),1)}%</b>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const id = new URLSearchParams(location.search).get("id");
const key = new URLSearchParams(location.hash.slice(1)).get("k");
const ub64 = t => Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((t.length+3)%4)), c=>c.charCodeAt(0));
const fail = () => { $("#app").innerHTML='<div class="empty">ページが見つかりませんでした。<br>お送りしたURLをそのまま開いてください。</div>'; };
async function load(){
  if (!id || !key || !/^\d+$/.test(id)) return fail();
  try{
    const r = await fetch(`data/${id}.enc.json`, {cache:"no-store"}); if(!r.ok) throw 0;
    const e = await r.json();
    const k = await crypto.subtle.importKey("raw", ub64(key), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(e.iv)}, k, ub64(e.ct));
    render(JSON.parse(new TextDecoder().decode(pt)));
  }catch(_){ fail(); }
}
load();

function render(p){
  const [y,m] = [p.month.slice(0,4), +p.month.slice(4)];
  const pm = m===1?12:m-1;
  const days = new Date(+y, m, 0).getDate();
  const asof = new Date(p.asof+"T00:00:00");
  const elapsed = asof.getMonth()+1===m ? asof.getDate() : days;
  const c = p.cur, v = p.prev;
  const dRate = pct(c.diamonds, v.diamonds);
  const pace = c.diamonds/elapsed*days;
  const matchShare = c.diamonds ? c.match_diamonds/c.diamonds*100 : null;
  document.title = `${p.name||p.username} ${m}月 | DeNA Creator Links`;

  const tiles = [
    ["ダイヤモンド", c.diamonds, "", 0, v.diamonds],
    ["LIVE時間", c.live_hours, "時間", 1, v.live_hours],
    ["有効LIVE日数", c.valid_days, "日", 0, v.valid_days],
    ["新規フォロワー", c.new_followers, "人", 0],
    ["LIVE Match数", c.match_count, "回", 0],
    ["LIVE Matchで獲得したダイヤ", c.match_diamonds, "", 0, null, matchShare!=null?`ダイヤ全体の ${fmt(matchShare,1)}%`:""],
    ["インプレッション", c.impressions, "", 0],
    ["1日あたりダイヤ", c.valid_days? c.diamonds/c.valid_days : null, "", 0, v.valid_days? v.diamonds/v.valid_days:null, "有効LIVE日1日あたり"],
  ];
  $("#app").innerHTML = `
  <header class="hero">
    <div class="pf">TikTok LIVE · ${y}年${m}月</div>
    <h1>${esc(p.name||p.username)}</h1>
    <div class="meta" style="margin:-2px 0 8px">@${esc(p.username)}</div>
    <div class="meta">${y}/${m}/1 〜 ${m}/${elapsed} 時点</div>
    <div class="meta">データ取得日：${(p.fetched||"").replaceAll("-","/")}</div>
    <div class="big"><span class="v">${fmt(c.diamonds)}</span><span class="u">ダイヤ</span>
      ${dRate!=null?`<span class="chip ${dRate>=0?'up':'down'}">前月比 ${dRate>=0?'+':''}${fmt(dRate,1)}%</span>`:''}</div>
    <div class="meta" style="margin-top:8px">このペースだと月末 <b>${fmt(pace)}</b> ダイヤ（前月 ${fmt(v.diamonds)}）</div>
  </header>
  <div class="notice">ⓘ 取得データは2日遅れのデータのため、LIVEセンターと誤差が出る場合があります。最新のデータを確認する場合は、<b>プロフィール → メニュー → TikTok Studio → LIVE</b> にてご確認ください。</div>

  <h2>${m}月の実績</h2>
  <div class="grid">${tiles.map(([k,val,u,d,prev,sub])=>`
    <div class="card"><div class="k">${k}</div><div class="v">${fmt(val,d)}<small>${u}</small></div>
    <div class="d">${prev!==undefined && prev!==null ? `前月 ${fmt(prev,d)} ${chg(pct(val,prev))}` : (sub||"&nbsp;")}</div></div>`).join("")}
  </div>

  <h2>前月との比較</h2>
  <div class="panel">
    <div class="legend"><span style="--c:var(--accent)">${m}月（${elapsed}日時点）</span><span style="--c:var(--prev)">${pm}月（確定）</span></div>
    <div class="cmp">${[["ダイヤモンド",c.diamonds,v.diamonds,"",0],["LIVE時間",c.live_hours,v.live_hours,"時間",1],["有効LIVE日数",c.valid_days,v.valid_days,"日",0]].map(([k,a,b,u,d])=>{
      const mx = Math.max(a||0,b||0)||1;
      return `<div class="cmprow"><div class="lab"><span>${k}</span><span>${chg(pct(a,b))}</span></div>
        <div class="bar cur"><i style="width:${(a||0)/mx*100}%"></i></div><div class="lab"><span style="color:var(--muted);font-size:11px">${m}月</span><span style="font-size:11px">${fmt(a,d)}${u}</span></div>
        <div class="bar prev"><i style="width:${(b||0)/mx*100}%"></i></div><div class="lab"><span style="color:var(--muted);font-size:11px">${pm}月</span><span style="font-size:11px">${fmt(b,d)}${u}</span></div></div>`}).join("")}
    </div>
    <div class="note">※${m}月はまだ途中（${elapsed}/${days}日）です。前月はひと月分の確定値です。</div>
  </div>

  <h2>ダイヤの積み上がり（前月ペースとの比較）</h2>
  <div class="panel">
    <div class="chartbox"><canvas id="cum"></canvas></div>
    <div class="note">実線＝${m}月の累計ダイヤ。点線＝前月と同じペースで積んだ場合の目安（前月合計 ÷ ${days}日 × 日数）。</div>
  </div>

  <h2>日別ダイヤ</h2>
  <div class="panel"><div class="chartbox" style="height:220px"><canvas id="day"></canvas></div>
    <div class="note">その日に増えたダイヤ（累計の差分）。点線＝前月の1日平均（前月合計 ÷ 前月の日数）。取得できなかった日はまとめて次の日に入ります。</div></div>
  `;

  const labels = Array.from({length:days},(_,i)=>`${m}/${i+1}`);
  const byDay = {}; p.daily.forEach(x=>byDay[+x.date.slice(8)] = x);
  const cum = labels.map((_,i)=>byDay[i+1]? byDay[i+1].diamonds : null);
  const prevPace = labels.map((_,i)=>Math.round(v.diamonds/days*(i+1)));
  let last = 0; const inc = labels.map((_,i)=>{const x=byDay[i+1]; if(!x) return null; const d=x.diamonds-last; last=x.diamonds; return d;});

  Chart.defaults.color = "#a3848f"; Chart.defaults.font.family = "'Noto Sans JP',sans-serif"; Chart.defaults.borderColor = "#f6dde6";
  const yk = {ticks:{callback:v=>v>=10000?(v/10000)+"万":v}, grid:{color:"#fbe9f0"}};
  const tip = {callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`}};
  new Chart($("#cum"),{type:"line",data:{labels,datasets:[
    {label:`${m}月 累計`,data:cum,borderColor:"#f06a9b",backgroundColor:"rgba(240,106,155,.14)",fill:true,tension:.25,pointRadius:2,spanGaps:true},
    {label:`${pm}月ペース`,data:prevPace,borderColor:"#c99bff",borderDash:[5,4],pointRadius:0,fill:false}]},
    options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{tooltip:tip,legend:{labels:{boxWidth:12}}},
      scales:{y:yk,x:{ticks:{maxTicksLimit:8},grid:{display:false}}}}});
  new Chart($("#day"),{type:"bar",data:{labels,datasets:[{label:"日別ダイヤ",data:inc,backgroundColor:"#f7a8c4",hoverBackgroundColor:"#f06a9b",borderRadius:8,order:2},
      {type:"line",label:`${pm}月の1日平均`,data:labels.map(()=>Math.round(v.diamonds/new Date(pm===12?+y-1:+y,pm,0).getDate()||0)),borderColor:"#c99bff",borderDash:[5,4],borderWidth:2,pointRadius:0,order:1}]},
    options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{labels:{boxWidth:12}},tooltip:tip},scales:{y:yk,x:{ticks:{maxTicksLimit:8},grid:{display:false}}}}});
}
</script>
</body>
</html>
